name: Idea 3b/7/8 - SOL ATR Sweep + DOGE Entry/Exit Ideas

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Idea #3b: SOL-only ATR compression multiplier sweep.
          # Original single test (1.2x) showed +24% ($243 -> $301) but was
          # never stability-checked - same standard as everything else
          # here. Baseline (no drift, no tighten) + drift-only + 4 tighten
          # multipliers. ----
          - { test: "sol_baseline", drift: "false", tighten: "false", atr_mult: "1.2" }
          - { test: "sol_drift_only", drift: "true", tighten: "false", atr_mult: "1.2" }
          - { test: "sol_tighten_1.0", drift: "true", tighten: "true", atr_mult: "1.0" }
          - { test: "sol_tighten_1.2", drift: "true", tighten: "true", atr_mult: "1.2" }
          - { test: "sol_tighten_1.5", drift: "true", tighten: "true", atr_mult: "1.5" }
          - { test: "sol_tighten_1.8", drift: "true", tighten: "true", atr_mult: "1.8" }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run SOL ATR sweep (${{ matrix.test }})
        working-directory: cloud-backtest
        env:
          BT_COINS: "SOL"
          BT_STRATEGIES: conservative
          BT_DAYS: ${{ inputs.days }}
          BT_MIN_SCORE_OVERRIDE: "80"
          BT_MAX_HOLD_HOURS: "18"
          BT_ATR_OVERRIDE: "2.5"
          BT_USE_ADVERSE_DRIFT: ${{ matrix.drift }}
          BT_DRIFT_STOP_TIGHTEN_ENABLED: ${{ matrix.tighten }}
          BT_DRIFT_STOP_TIGHTEN_ATR_MULTIPLIER: ${{ matrix.atr_mult }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit results
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-backtest-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet && exit 0
          git commit -m "Idea 3b SOL ATR sweep: ${{ matrix.test }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            if git pull --rebase; then continue; fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add results/
            git commit -m "Idea 3b SOL ATR sweep: ${{ matrix.test }} [skip ci]" --allow-empty
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: idea3b-sol-atr-${{ matrix.test }}
          path: cloud-backtest/results/
          retention-days: 90

  doge_backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Idea #7: DOGE volatility expansion entry gate ----
          - { test: "doge_baseline", vol_gate: "false", min_ratio: "1.0", stage_frac: "0.3333,0.3333,0.3334" }
          - { test: "doge_volgate_1.0", vol_gate: "true", min_ratio: "1.0", stage_frac: "0.3333,0.3333,0.3334" }
          - { test: "doge_volgate_1.2", vol_gate: "true", min_ratio: "1.2", stage_frac: "0.3333,0.3333,0.3334" }
          - { test: "doge_volgate_0.8", vol_gate: "true", min_ratio: "0.8", stage_frac: "0.3333,0.3333,0.3334" }
          # ---- Idea #8: DOGE asymmetric TP weighting ----
          - { test: "doge_tp_20_30_50", vol_gate: "false", min_ratio: "1.0", stage_frac: "0.2,0.3,0.5" }
          - { test: "doge_tp_15_25_60", vol_gate: "false", min_ratio: "1.0", stage_frac: "0.15,0.25,0.6" }
          # ---- Both idea #7 and #8 together ----
          - { test: "doge_volgate_and_tp", vol_gate: "true", min_ratio: "1.0", stage_frac: "0.2,0.3,0.5" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run DOGE test (${{ matrix.test }})
        working-directory: cloud-backtest
        env:
          BT_COINS: "DOGE"
          BT_STRATEGIES: conservative
          BT_DAYS: ${{ inputs.days }}
          BT_MIN_SCORE_OVERRIDE: "79"
          BT_MAX_HOLD_HOURS: "48"
          BT_ATR_OVERRIDE: "2.5"
          BT_USE_VOLATILITY_EXPANSION_GATE: ${{ matrix.vol_gate }}
          BT_MIN_ATR_RATIO_FOR_ENTRY: ${{ matrix.min_ratio }}
          BT_STAGE_FRACTIONS: ${{ matrix.stage_frac }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit results
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-backtest-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet && exit 0
          git commit -m "Idea 7/8 DOGE: ${{ matrix.test }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            if git pull --rebase; then continue; fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add results/
            git commit -m "Idea 7/8 DOGE: ${{ matrix.test }} [skip ci]" --allow-empty
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: idea7-8-doge-${{ matrix.test }}
          path: cloud-backtest/results/
          retention-days: 90
