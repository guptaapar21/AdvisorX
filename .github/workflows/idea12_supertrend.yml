name: Idea 12 - SuperTrend (1m/3m/15m)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window - 180d default (1m data for a full year is enormous; override if you want the full year anyway)"
        required: false
        default: "180"
      max_hold_hours:
        description: "Max hold time before a forced exit"
        required: false
        default: "4"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        coin: [SOL, DOGE, ETH]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run 36-combo sweep for ${{ matrix.coin }} across 1m/3m/15m (one fetch)
        working-directory: cloud-backtest
        run: >
          python run_supertrend_backtest.py
          --coin ${{ matrix.coin }}
          --days ${{ inputs.days }}
          --max-hold-hours ${{ inputs.max_hold_hours }}
          --sweep-all
