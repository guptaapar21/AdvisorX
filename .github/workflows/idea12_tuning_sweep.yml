name: Idea 12 - SuperTrend Tuning (Path A - fee-drag fix)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window - 180d default, same window as the original idea #12 sweep"
        required: false
        default: "180"
      max_hold_hours:
        description: "Max hold time before a forced exit"
        required: false
        default: "4"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        coin: [SOL, DOGE, ETH]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run 48-combo tuning sweep for ${{ matrix.coin }} at 3m (one fetch)
        working-directory: cloud-backtest
        run: >
          python run_supertrend_backtest.py
          --coin ${{ matrix.coin }}
          --days ${{ inputs.days }}
          --max-hold-hours ${{ inputs.max_hold_hours }}
          --sweep-tuning
