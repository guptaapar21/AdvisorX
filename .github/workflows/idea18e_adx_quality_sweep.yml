name: Idea 18E - ADX Threshold + Slope + DI (Multi-Coin)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Backtest lookback in days"
        required: false
        default: "365"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        coin:
          - BTC
          - ETH
          - XRP
          - SOL
          - BNB
          - DOGE
          - ADA
          - TRX
          - LINK
          - AVAX
          - LTC
          - DOT

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud-backtest/requirements.txt

      - name: Verify Idea 18E file
        run: |
          test -f cloud-backtest/run_ema_pullback_backtest_adx_sweep.py
          grep -q "ensure_adx_di_columns" cloud-backtest/run_ema_pullback_backtest_adx_sweep.py
          echo "Corrected Idea 18E Python file detected."

      - name: Run Idea 18E ADX quality sweep - ${{ matrix.coin }}
        working-directory: cloud-backtest
        run: |
          python run_ema_pullback_backtest_adx_sweep.py --coin "${{ matrix.coin }}" --days "${{ inputs.days }}" --adx-quality-sweep \
            2>&1 | tee "idea18e_${{ matrix.coin }}.log"

      - name: Upload results - ${{ matrix.coin }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea18e-${{ matrix.coin }}
          path: cloud-backtest/idea18e_${{ matrix.coin }}.log
          if-no-files-found: ignore
