name: Idea 18E - Low Fee Markets (XAU XAG CL BZ NATGAS PAXG)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Backtest lookback in days"
        required: false
        default: "365"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        coin: [XAU, XAG, CL, BZ, NATGAS, PAXG]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud-backtest/requirements.txt

      - name: Verify Idea 18E low-fee test file
        run: |
          test -f cloud-backtest/run_ema_pullback_backtest_adx_sweep.py
          grep -q -- "--fee-rate" cloud-backtest/run_ema_pullback_backtest_adx_sweep.py
          echo "Low-fee capable Idea 18E Python file detected."

      - name: Run Idea 18E on ${{ matrix.coin }} at 0.01% per-side fee
        working-directory: cloud-backtest
        run: |
          python run_ema_pullback_backtest_adx_sweep.py \
            --coin "${{ matrix.coin }}" \
            --days "${{ inputs.days }}" \
            --fee-rate 0.0001 \
            --adx-quality-sweep
