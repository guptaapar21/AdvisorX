name: Idea 18D - Structure + ADX (BTC only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Backtest lookback in days"
        required: false
        default: "365"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Idea 18D structural sweep
        run: |
          python run_ema_pullback_backtest_structure.py --coin BTC --days ${{ inputs.days }} --structure-sweep
