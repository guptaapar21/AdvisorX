name: Idea 18F Live Signal Monitor (advisory only)

on:
  workflow_dispatch: {}
  # No schedule here either - matching fastwatch.yml/agent.yml's own
  # convention: triggered by an EXTERNAL cron-job.org job pointed at
  # this workflow (e.g. every 3 minutes, matching the 3m timeframe),
  # not GitHub's own native `schedule:` trigger. This is a deliberate
  # choice already established elsewhere in this project - GH's native
  # scheduler is known to be unreliable under load and gets disabled
  # entirely on inactive repos.

permissions:
  contents: write

concurrency:
  group: idea18f-live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt requests

      - name: Run live signal monitor
        working-directory: cloud-backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python live_signal_monitor_18f.py
          --coins BTC,ETH,BNB,SOL,XRP,DOGE,LTC,LINK,TRX,AVAX,HEI,BICO,HYPE,ZEC,ZBT,ADA,ACE,PAXG
          --adx-min 35
          --adx-mode slope3

      - name: Persist alert-dedup state
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-18f-monitor-bot"
          git config user.email "actions@github.com"
          git add live_monitor_state.json
          git diff --staged --quiet && exit 0
          git commit -m "Update Idea 18F live monitor state [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), pulling and retrying..."
            if git pull --rebase; then
              continue
            fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add live_monitor_state.json
            git commit -m "Update Idea 18F live monitor state [skip ci]" --allow-empty
          done
          echo "Failed to push state after 3 attempts."
          exit 1
