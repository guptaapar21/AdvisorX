name: Idea 10 - 5m Momentum Scalp (parallel optimization)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"
      max_hold_hours:
        description: "Max hold time in hours before a forced exit (this is a scalp - kept short)"
        required: false
        default: "4"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        coin: [SOL, DOGE, ETH]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run full 24-combo sweep for ${{ matrix.coin }} (one fetch, not 24)
        working-directory: cloud-backtest
        run: >
          python run_momentum_scalp_backtest.py
          --coin ${{ matrix.coin }}
          --days ${{ inputs.days }}
          --max-hold-hours ${{ inputs.max_hold_hours }}
          --sweep-all
