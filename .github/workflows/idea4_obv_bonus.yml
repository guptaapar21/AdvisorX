name: Idea 4 - OBV Confirmation Bonus

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"
      use_real_cvd:
        description: "true = fetch REAL taker buy/sell volume from Binance (see binance_taker_volume_fetcher.py) and use genuine CVD instead of the OBV proxy. UNCONFIRMED whether Binance is reachable from GitHub Actions runners - if blocked (HTTP 451), this falls back to the OBV proxy automatically, check the job log for which one actually ran. false (default) = always uses the OBV proxy, same as before."
        required: false
        default: "false"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 0 (baseline, off) / 8 / 15 extra reversal-score points when OBV
          # confirms the adverse move. NOTE: OBV here is a proxy, NOT real
          # CVD - CoinDCX's public candles have no taker buy/sell split
          # (see indicators.py detect_obv_price_divergence for the caveat).
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, obv_bonus: 0 }
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, obv_bonus: 8 }
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, obv_bonus: 15 }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, obv_bonus: 0 }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, obv_bonus: 8 }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, obv_bonus: 15 }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, obv_bonus: 0 }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, obv_bonus: 8 }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, obv_bonus: 15 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run backtest (${{ matrix.coin }} / obv_bonus=${{ matrix.obv_bonus }} / real_cvd=${{ inputs.use_real_cvd }})
        working-directory: cloud-backtest
        env:
          BT_COINS: ${{ matrix.coin }}
          BT_STRATEGIES: conservative
          BT_DAYS: ${{ inputs.days }}
          BT_MIN_SCORE_OVERRIDE: ${{ matrix.min_score }}
          BT_MAX_HOLD_HOURS: ${{ matrix.max_hold_hours }}
          BT_ATR_OVERRIDE: "2.5"
          BT_OBV_CONFIRMATION_BONUS: ${{ matrix.obv_bonus }}
          BT_USE_REAL_CVD: ${{ inputs.use_real_cvd }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit results
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-backtest-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet && exit 0
          git commit -m "Idea 4 OBV bonus: ${{ matrix.coin }} bonus=${{ matrix.obv_bonus }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            if git pull --rebase; then continue; fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add results/
            git commit -m "Idea 4 OBV bonus: ${{ matrix.coin }} bonus=${{ matrix.obv_bonus }} [skip ci]" --allow-empty
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: idea4-obv-bonus-${{ matrix.coin }}-${{ matrix.obv_bonus }}
          path: cloud-backtest/results/
          retention-days: 90
