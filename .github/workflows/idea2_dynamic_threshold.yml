name: Idea 2 - Dynamic Threshold

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # off (baseline, matches live) / on, for each of the 3 real coin settings
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, dynamic_threshold: "false" }
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, dynamic_threshold: "true" }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, dynamic_threshold: "false" }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, dynamic_threshold: "true" }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, dynamic_threshold: "false" }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, dynamic_threshold: "true" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run backtest (${{ matrix.coin }} / dynamic_threshold=${{ matrix.dynamic_threshold }})
        working-directory: cloud-backtest
        env:
          BT_COINS: ${{ matrix.coin }}
          BT_STRATEGIES: conservative
          BT_DAYS: ${{ inputs.days }}
          BT_MIN_SCORE_OVERRIDE: ${{ matrix.min_score }}
          BT_MAX_HOLD_HOURS: ${{ matrix.max_hold_hours }}
          BT_ATR_OVERRIDE: "2.5"
          BT_DYNAMIC_THRESHOLD_ENABLED: ${{ matrix.dynamic_threshold }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit results
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-backtest-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet && exit 0
          git commit -m "Idea 2 dynamic threshold: ${{ matrix.coin }} dyn=${{ matrix.dynamic_threshold }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            if git pull --rebase; then continue; fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add results/
            git commit -m "Idea 2 dynamic threshold: ${{ matrix.coin }} dyn=${{ matrix.dynamic_threshold }} [skip ci]" --allow-empty
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: idea2-dynamic-threshold-${{ matrix.coin }}-${{ matrix.dynamic_threshold }}
          path: cloud-backtest/results/
          retention-days: 90
