name: Idea 18F - Rejection Structure + EMA VWAP Slope

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Backtest lookback in days"
        required: false
        default: "365"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        coin: [BTC, ETH, BNB, SOL, XRP, DOGE, LTC, LINK, TRX, AVAX]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud-backtest/requirements.txt

      - name: Verify Idea 18F test file
        run: |
          test -f cloud-backtest/run_ema_pullback_backtest_18f_rejection.py
          grep -q "IDEA #18F rejection structure" cloud-backtest/run_ema_pullback_backtest_18f_rejection.py
          echo "Idea 18F Python file detected."

      - name: Run Idea 18F on ${{ matrix.coin }}
        working-directory: cloud-backtest
        run: |
          python run_ema_pullback_backtest_18f_rejection.py \
            --coin "${{ matrix.coin }}" \
            --days "${{ inputs.days }}" \
            --adx-quality-sweep
