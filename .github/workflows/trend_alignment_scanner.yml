name: Trend Alignment Scanner (V4 execution quality)

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  RESEARCH_CADENCE_SECONDS: "1800"
  RESEARCH_SCHEDULE_STATE: "cloud-backtest/research_schedule_state.json"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure freshest state
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Verify V4 integration and research bridge
        working-directory: cloud-backtest
        run: |
          python -m py_compile trend_alignment_scanner_live.py advisorx_trade_management_policy.py advisorx_trade_resolution.py entry_quality_gate.py portfolio_risk.py v2_live_integration.py candidate_funnel.py trade_counterfactuals.py market_behavior_recorder.py research_analyst.py run_scanner_with_research.py test_v2_integration.py test_v2_invariants.py test_v4_logic.py test_market_behavior_recorder.py test_research_analyst.py
          PYTHONPATH=. python -m unittest -v test_v2_integration.py test_v2_invariants.py test_v4_logic.py test_market_behavior_recorder.py test_research_analyst.py
      - name: Decide whether 30-minute research refresh is due
        id: research_due
        working-directory: cloud-backtest
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          path = Path("research_schedule_state.json")
          now = int(time.time())
          last = None
          if path.exists():
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  value = payload.get("last_run_epoch")
                  last = int(value) if value is not None else None
              except (OSError, ValueError, TypeError):
                  last = None

          cadence = int(os.environ.get("RESEARCH_CADENCE_SECONDS", "1800"))
          due = last is None or (now - last) >= cadence
          print(f"research_last_run_epoch={last}")
          print(f"research_now_epoch={now}")
          print(f"research_cadence_seconds={cadence}")
          print(f"research_due={str(due).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"due={'true' if due else 'false'}\n")
          PY
      - name: Refresh validated research formulations
        if: steps.research_due.outputs.due == 'true'
        working-directory: cloud-backtest
        run: |
          python research_analyst.py \
            --root market_behavior_research \
            --output research_formulations.json \
            --fee-pct 0.15
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          Path("research_schedule_state.json").write_text(
              json.dumps({
                  "last_run_epoch": int(time.time()),
                  "cadence_seconds": 1800,
                  "updated_by": "trend_alignment_scanner",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Report research cadence
        working-directory: cloud-backtest
        run: |
          if [ "${{ steps.research_due.outputs.due }}" = "true" ]; then
            echo "Research analyst refreshed this scanner cycle (30-minute cadence reached)."
          else
            echo "Research analyst not due; scanner will use the latest validated research formulations."
          fi
      - name: Run trend alignment scanner with V4 execution and latest research feedback
        working-directory: cloud-backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          USDT_INR_RATE: "99.44"
          GEMINI_RAW_LOG_PATH: "gemini_raw_responses.log"
          MIN_RR: "1.5"
          MAX_STOP_PCT: "0.08"
          MIN_STOP_ATR_MULTIPLIER: "2.0"
          MAX_ENTRY_DISTANCE_ATR: "1.5"
          BREAKOUT_MAX_BARS: "12"
          BREAKOUT_MAX_EXTENSION_ATR: "1.5"
          V4_RANGE_STRETCHED_PCT: "85"
          V4_RANGE_EXTREME_PCT: "92"
          V4_RANGE_CRITICAL_PCT: "97"
          V4_EXTENDED_ATR: "1.25"
          V4_CRITICAL_EXTENSION_ATR: "2.0"
          V4_EXHAUSTION_WARN_SCORE: "2"
          V4_EXHAUSTION_HARD_SCORE: "3"
          V4_FAILED_BREAK_WARN_COUNT: "2"
          V4_FAILED_BREAK_HARD_COUNT: "4"
          V4_SWEEP_WARN_COUNT: "3"
          V4_MIN_ENTRY_QUALITY_SCORE: "3"
          V4_MAX_CORRELATED_SAME_DIRECTION: "2"
          V4_MAX_CORRELATED_CLUSTER_POSITIONS: "3"
          V4_SEVERE_GIVEBACK_PCT: "75"
          V4_SEVERE_GIVEBACK_MFE_R: "1.0"
          V4_SEVERE_HEALTH_SCORE: "3"
          MIN_PROFIT_R_TO_TIGHTEN: "0.5"
          CANDIDATE_FUNNEL_FILE: "candidate_funnel.jsonl"
          COUNTERFACTUAL_FILE: "trade_counterfactuals.jsonl"
          RESOLVED_TRADES_FILE: "resolved_trades.jsonl"
          FAILURE_TO_LAUNCH_SHADOW_FILE: "failure_to_launch_shadow.jsonl"
        run: >
          python run_scanner_with_research.py
          --coins BTC,ETH,BNB,SOL,XRP,DOGE,LTC,LINK,TRX,AVAX,HEI,BICO,HYPE,ZEC,ZBT,ADA,ACE,PAXG
      - name: Capture future market behaviour evidence
        continue-on-error: true
        working-directory: cloud-backtest
        run: >
          python market_behavior_recorder.py
          --coins BTC,ETH,BNB,SOL,XRP,DOGE,LTC,LINK,TRX,AVAX,HEI,BICO,HYPE,ZEC,ZBT,ADA,ACE,PAXG
          --root market_behavior_research
          --state market_behavior_state.json
          --lookback-min 240
      - name: Upload V4 and research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisorx-v4-telemetry-${{ github.run_id }}
          path: |
            cloud-backtest/candidate_funnel.jsonl
            cloud-backtest/trade_counterfactuals.jsonl
            cloud-backtest/resolved_trades.jsonl
            cloud-backtest/failure_to_launch_shadow.jsonl
            cloud-backtest/gemini_raw_responses.log
            cloud-backtest/market_behavior_state.json
            cloud-backtest/research_formulations.json
            cloud-backtest/research_schedule_state.json
            cloud-backtest/market_behavior_research/**/*.jsonl
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
      - name: Persist scanner state and research evidence
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-trend-scanner-bot"
          git config user.email "actions@github.com"
          git add trend_scanner_state.json
          [ -f market_behavior_state.json ] && git add market_behavior_state.json || true
          [ -f research_formulations.json ] && git add research_formulations.json || true
          [ -f research_schedule_state.json ] && git add research_schedule_state.json || true
          [ -d market_behavior_research ] && git add -A market_behavior_research || true
          git diff --staged --quiet && exit 0
          git commit -m "Update trend scanner state, research and evidence [skip ci]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $i), pulling and retrying..."
            if git pull --rebase; then continue; fi
            echo "Rebase hit a real conflict - keeping this run's state values on top of latest remote."
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add trend_scanner_state.json
            [ -f market_behavior_state.json ] && git add market_behavior_state.json || true
            [ -f research_formulations.json ] && git add research_formulations.json || true
            [ -f research_schedule_state.json ] && git add research_schedule_state.json || true
            [ -d market_behavior_research ] && git add -A market_behavior_research || true
            git commit -m "Update trend scanner state, research and evidence [skip ci]" --allow-empty
          done
          echo "Failed to push state after 3 attempts."
          exit 1