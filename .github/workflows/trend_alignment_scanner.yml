name: Trend Alignment Scanner (advisory only)

on:
  # The live scanner is triggered externally by cron-job.org every minute.
  # Do NOT add a GitHub schedule here; that would create a second scheduler
  # and can cause duplicate/competing runs.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trend-alignment-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure freshest state
        run: git fetch origin main && git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt

      - name: Flush any queued Telegram message without blocking scanner
        continue-on-error: true
        working-directory: cloud-backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import html, json, os, re, requests
          from datetime import datetime, timezone
          from pathlib import Path

          state_path = Path("trend_scanner_state.json")
          if not state_path.exists():
              print("No scanner state yet; continuing.")
              raise SystemExit(0)

          state = json.loads(state_path.read_text(encoding="utf-8"))
          pending = state.get("pending_telegram")
          if not pending:
              print("No queued Telegram message.")
              raise SystemExit(0)

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          text = str(pending.get("text", ""))
          markup = pending.get("reply_markup")

          text = re.sub(r"</?b>", "", text, flags=re.I)
          text = html.unescape(text)

          def chunks(s, n=3900):
              out, cur = [], ""
              for line in s.splitlines(True):
                  if cur and len(cur) + len(line) > n:
                      out.append(cur.rstrip())
                      cur = ""
                  while len(line) > n:
                      out.append(line[:n])
                      line = line[n:]
                  cur += line
              if cur.strip() or not out:
                  out.append(cur.rstrip())
              return out

          delivered = False
          error = None

          if token and chat_id:
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              try:
                  parts = chunks(text)
                  for i, part in enumerate(parts):
                      payload = {"chat_id": chat_id, "text": part}
                      if i == len(parts) - 1 and markup:
                          payload["reply_markup"] = markup
                      response = requests.post(url, json=payload, timeout=15)
                      if not response.ok:
                          raise RuntimeError(
                              f"Telegram {response.status_code}: {response.text[:1000]}"
                          )
                  delivered = True
                  print(f"Queued Telegram message delivered ({len(parts)} chunk(s)).")
              except Exception as exc:
                  error = str(exc)
                  print(f"Queued Telegram delivery failed; scanner will continue: {error}")
          else:
              error = "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID"
              print(error)

          # Critical: never leave pending_telegram set here.
          # The scanner must not return before CoinDCX/Gemini scanning.
          state["pending_telegram"] = None
          state["telegram_last_delivery_ok"] = delivered
          state["telegram_last_delivery_error"] = error
          state["telegram_last_delivery_at"] = datetime.now(timezone.utc).isoformat()
          state_path.write_text(json.dumps(state, indent=2), encoding="utf-8")
          PY

      - name: Run trend alignment scanner
        working-directory: cloud-backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          USDT_INR_RATE: "99.44"
          GEMINI_RAW_LOG_PATH: "gemini_raw_responses.log"
          MIN_RR: "1.5"
          MAX_STOP_PCT: "0.08"
          MIN_STOP_ATR_MULTIPLIER: "1.2"
        run: >
          python trend_alignment_scanner.py
          --coins BTC,ETH,BNB,SOL,XRP,DOGE,LTC,LINK,TRX,AVAX,HEI,BICO,HYPE,ZEC,ZBT,ADA,ACE,PAXG

      - name: Upload Gemini raw-response diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-raw-responses-${{ github.run_id }}
          path: cloud-backtest/gemini_raw_responses.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Flush current Telegram update without blocking state persistence
        continue-on-error: true
        working-directory: cloud-backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import html, json, os, re, requests
          from datetime import datetime, timezone
          from pathlib import Path

          state_path = Path("trend_scanner_state.json")
          if not state_path.exists():
              raise SystemExit(0)

          state = json.loads(state_path.read_text(encoding="utf-8"))
          pending = state.get("pending_telegram")
          if not pending:
              print("No current Telegram update queued.")
              raise SystemExit(0)

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          text = str(pending.get("text", ""))
          markup = pending.get("reply_markup")

          text = re.sub(r"</?b>", "", text, flags=re.I)
          text = html.unescape(text)

          parts, cur = [], ""
          for line in text.splitlines(True):
              if cur and len(cur) + len(line) > 3900:
                  parts.append(cur.rstrip())
                  cur = ""
              while len(line) > 3900:
                  parts.append(line[:3900])
                  line = line[3900:]
              cur += line
          if cur.strip() or not parts:
              parts.append(cur.rstrip())

          delivered = False
          error = None

          if token and chat_id:
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              try:
                  for i, part in enumerate(parts):
                      payload = {"chat_id": chat_id, "text": part}
                      if i == len(parts) - 1 and markup:
                          payload["reply_markup"] = markup
                      response = requests.post(url, json=payload, timeout=15)
                      if not response.ok:
                          raise RuntimeError(
                              f"Telegram {response.status_code}: {response.text[:1000]}"
                          )
                  delivered = True
                  print(f"Current Telegram update delivered ({len(parts)} chunk(s)).")
              except Exception as exc:
                  error = str(exc)
                  print(f"Current Telegram delivery failed: {error}")
          else:
              error = "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID"
              print(error)

          # The message is an output channel, not a market-state dependency.
          state["pending_telegram"] = None
          state["telegram_last_delivery_ok"] = delivered
          state["telegram_last_delivery_error"] = error
          state["telegram_last_delivery_at"] = datetime.now(timezone.utc).isoformat()
          state_path.write_text(json.dumps(state, indent=2), encoding="utf-8")
          PY

      - name: Persist scanner state
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-trend-scanner-bot"
          git config user.email "actions@github.com"
          git add trend_scanner_state.json
          git diff --staged --quiet && exit 0
          git commit -m "Update trend alignment scanner state [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), pulling and retrying..."
            if git pull --rebase; then
              continue
            fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add trend_scanner_state.json
            git commit -m "Update trend alignment scanner state [skip ci]" --allow-empty
          done
          echo "Failed to push state after 3 attempts."
          exit 1
