name: Trend Alignment Scanner (advisory only)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trend-alignment-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Ensure freshest state
        run: git fetch origin main && git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt

      - name: Verify V2 integration
        working-directory: cloud-backtest
        run: |
          python -m py_compile trend_alignment_scanner_live.py v2_live_integration.py candidate_funnel.py trade_counterfactuals.py portfolio_risk.py test_v2_integration.py test_v2_invariants.py
          PYTHONPATH=. python -m unittest -v test_v2_integration.py test_v2_invariants.py

      - name: Run trend alignment scanner with V2 research telemetry
        working-directory: cloud-backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          USDT_INR_RATE: "99.44"
          GEMINI_RAW_LOG_PATH: "gemini_raw_responses.log"

          # Production risk geometry: workflow is the runtime source of truth.
          MIN_RR: "1.5"
          MAX_STOP_PCT: "0.08"
          MIN_STOP_ATR_MULTIPLIER: "2.0"

          # Controlled opportunity-frequency configuration only.
          MAX_ENTRY_DISTANCE_ATR: "1.5"
          BREAKOUT_MAX_BARS: "12"
          BREAKOUT_MAX_EXTENSION_ATR: "1.5"

          # Research files are runner-local and uploaded as artifacts.
          CANDIDATE_FUNNEL_FILE: "candidate_funnel.jsonl"
          COUNTERFACTUAL_FILE: "trade_counterfactuals.jsonl"
          RESOLVED_TRADES_FILE: "resolved_trades.jsonl"
          FAILURE_TO_LAUNCH_SHADOW_FILE: "failure_to_launch_shadow.jsonl"

        run: >
          python trend_alignment_scanner_live.py
          --coins BTC,ETH,BNB,SOL,XRP,DOGE,LTC,LINK,TRX,AVAX,HEI,BICO,HYPE,ZEC,ZBT,ADA,ACE,PAXG

      - name: Upload research and operational diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisorx-v2-telemetry-${{ github.run_id }}
          path: |
            cloud-backtest/candidate_funnel.jsonl
            cloud-backtest/trade_counterfactuals.jsonl
            cloud-backtest/resolved_trades.jsonl
            cloud-backtest/failure_to_launch_shadow.jsonl
            cloud-backtest/gemini_raw_responses.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist scanner state
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-trend-scanner-bot"
          git config user.email "actions@github.com"
          git add trend_scanner_state.json
          git diff --staged --quiet && exit 0

          git commit -m "Update trend alignment scanner state [skip ci]"

          for i in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push rejected (attempt $i), pulling and retrying..."
            if git pull --rebase; then
              continue
            fi

            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add trend_scanner_state.json
            git commit -m "Update trend alignment scanner state [skip ci]" --allow-empty
          done

          echo "Failed to push state after 3 attempts."
          exit 1
