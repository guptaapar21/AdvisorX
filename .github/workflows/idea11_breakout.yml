name: Idea 11 - Consolidation Breakout

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"
      max_hold_hours:
        description: "Max hold time before a forced exit"
        required: false
        default: "6"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        coin: [SOL, DOGE, ETH]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run full 18-combo sweep for ${{ matrix.coin }} (one fetch)
        working-directory: cloud-backtest
        run: >
          python run_breakout_backtest.py
          --coin ${{ matrix.coin }}
          --days ${{ inputs.days }}
          --max-hold-hours ${{ inputs.max_hold_hours }}
          --sweep-all
