name: AdvisorX CoinDCX Pre-Filter Lab

on:
  workflow_dispatch:
    inputs:
      research_days:
        description: "Historical research window (15-30 days)"
        required: false
        default: "30"
      recent_oos_days:
        description: "Frozen recent out-of-sample window (3-7 days)"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: advisorx-coindcx-prefilter-lab
  cancel-in-progress: false

jobs:
  prefilter:
    name: CoinDCX pre-filter research
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      PREFILTER_RESEARCH_DAYS: ${{ inputs.research_days || '30' }}
      PREFILTER_RECENT_OOS_DAYS: ${{ inputs.recent_oos_days || '3' }}
      PREFILTER_COINS: BTC,ETH,BNB,SOL,XRP,DOGE,LTC,LINK,TRX,AVAX,HYPE,ZEC,ADA,ACE,PAXG
      PREFILTER_TARGET_HORIZON: "15"
      PREFILTER_MIN_TRADES: "40"
      PREFILTER_MIN_COINS: "4"
      PREFILTER_MIN_BLOCKS: "8"
      PREFILTER_MIN_BLOCK_POSITIVE: "0.60"
      PREFILTER_MIN_COIN_POSITIVE: "0.60"
      PREFILTER_FEE_RATE: "0.00059"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud-backtest/requirements.txt
          pip install "pytest>=8.0"

      - name: Verify research engine inputs
        run: |
          test -f cloud-backtest/coindcx_fetcher.py
          test -f cloud-backtest/prefilter_lab/run_prefilter_lab.py
          test -f cloud-backtest/prefilter_lab/test_prefilter_lab.py

      - name: Run unit tests
        working-directory: cloud-backtest
        run: |
          PYTHONPATH=. python -m pytest prefilter_lab/test_prefilter_lab.py -q

      - name: Run 30-day research + frozen recent OOS study
        working-directory: cloud-backtest
        run: |
          PYTHONPATH=. python prefilter_lab/run_prefilter_lab.py

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisorx-prefilter-${{ github.run_id }}
          path: cloud-backtest/prefilter_output/
          if-no-files-found: warn
          retention-days: 30
