name: RVOL Percentile Refresh (daily)

on:
  workflow_dispatch: {}
  schedule:
    # Runs once daily at 00:15 UTC (05:45 IST) - a heavier pull (~15
    # API requests per coin for 30 days of history) that would be
    # wasteful and unnecessary to run on the live scanner's 1-minute
    # cadence. The live scanner only ever READS the small file this
    # produces, never runs this pull itself.
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: rvol-percentile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ensure freshest state
        run: git fetch origin main && git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt

      - name: Refresh RVOL percentiles
        working-directory: cloud-backtest
        run: >
          python rvol_percentile_refresh.py
          --coins BTC,ETH,BNB,SOL,XRP,DOGE,LTC,LINK,TRX,AVAX,HEI,BICO,HYPE,ZEC,ZBT,ADA,ACE,PAXG
          --days 30

      - name: Persist percentile file
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-rvol-percentile-bot"
          git config user.email "actions@github.com"
          git add rvol_percentiles.json daily_candles_30d.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh RVOL percentiles and daily context [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), pulling and retrying..."
            if git pull --rebase; then
              continue
            fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add rvol_percentiles.json daily_candles_30d.json
            git commit -m "Refresh RVOL percentiles and daily context [skip ci]" --allow-empty
          done
          echo "Failed to push percentile file after 3 attempts."
          exit 1
