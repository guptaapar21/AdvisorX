name: Idea 18 - EMA Pullback + VWAP (BTC only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run minimum-stop sweep for BTC (one fetch)
        working-directory: cloud-backtest
        run: >
          python run_ema_pullback_backtest.py
          --coin BTC
          --days ${{ inputs.days }}
          --min-stop-sweep
