name: Idea 3 - ATR Stop Tighten on Drift

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # off (baseline) / on, for each real coin setting. adverse_drift is
          # forced true in every job here - stop-tighten only has any effect
          # when drift itself is on (see backtest_engine.py).
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, stop_tighten: "false" }
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, stop_tighten: "true" }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, stop_tighten: "false" }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, stop_tighten: "true" }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, stop_tighten: "false" }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, stop_tighten: "true" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run backtest (${{ matrix.coin }} / drift_stop_tighten=${{ matrix.stop_tighten }})
        working-directory: cloud-backtest
        env:
          BT_COINS: ${{ matrix.coin }}
          BT_STRATEGIES: conservative
          BT_DAYS: ${{ inputs.days }}
          BT_MIN_SCORE_OVERRIDE: ${{ matrix.min_score }}
          BT_MAX_HOLD_HOURS: ${{ matrix.max_hold_hours }}
          BT_ATR_OVERRIDE: "2.5"
          BT_USE_ADVERSE_DRIFT: "true"
          BT_DRIFT_STOP_TIGHTEN_ENABLED: ${{ matrix.stop_tighten }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit results
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-backtest-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet && exit 0
          git commit -m "Idea 3 stop tighten: ${{ matrix.coin }} tighten=${{ matrix.stop_tighten }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            if git pull --rebase; then continue; fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add results/
            git commit -m "Idea 3 stop tighten: ${{ matrix.coin }} tighten=${{ matrix.stop_tighten }} [skip ci]" --allow-empty
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: idea3-stop-tighten-${{ matrix.coin }}-${{ matrix.stop_tighten }}
          path: cloud-backtest/results/
          retention-days: 90
