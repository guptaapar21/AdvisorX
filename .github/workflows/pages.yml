name: Deploy dashboard to Pages

# Classic "Deploy from a branch" Pages rebuilds on EVERY push to main,
# ignoring [skip ci] entirely - which meant every fastwatch/agent state
# commit (every ~2 min) was also triggering a Pages rebuild and adding to
# the same runner queue that caused the earlier backlog/cancellation
# problem. This workflow replaces that: it's a normal Actions workflow, so
# `paths:` actually filters it, and it only runs when dashboard.html
# itself changes - never on advisories.json/liveSnapshot.json/etc commits.
on:
  push:
    branches: [main]
    paths:
      - "dashboard.html"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
