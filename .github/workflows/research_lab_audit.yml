
name: AdvisorX ResearchLab Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: advisorx-researchlab-data
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ResearchLab data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloud-backtest/research_lab_data
          mkdir -p cloud-backtest/research_lab_data
          if git ls-remote --exit-code --heads origin researchlab-data >/dev/null 2>&1; then
            git fetch origin researchlab-data
            git archive origin/researchlab-data -- cloud-backtest/research_lab_data \
              | tar -x --strip-components=2 -C cloud-backtest/research_lab_data
            rm -rf cloud-backtest/research_lab_data/cloud-backtest
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: researchlab-pip-${{ runner.os }}-${{ hashFiles('cloud-backtest/research_lab/requirements.txt') }}
          restore-keys: |
            researchlab-pip-${{ runner.os }}-

      - name: Install ResearchLab dependencies
        run: python -m pip install -r cloud-backtest/research_lab/requirements.txt

      - name: Verify ResearchLab dataset
        shell: bash
        run: |
          set -euo pipefail
          test -s cloud-backtest/research_lab_data/observations.jsonl
          echo "Observations: $(wc -l < cloud-backtest/research_lab_data/observations.jsonl)"

      - name: Run deterministic audit
        env:
          PYTHONPATH: cloud-backtest
          RESEARCH_AUDIT_OUTPUT_DIR: research_audit_output
        run: |
          export RESEARCH_AUDIT_CUTOFF="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          python -m research_lab.research_audit

      - name: Upload full audit
        uses: actions/upload-artifact@v4
        with:
          name: research-audit-${{ github.run_id }}
          path: research_audit_output/
          retention-days: 30

      - name: Persist audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'advisorx-research-bot'
          git config user.email 'actions@github.com'
          rm -rf /tmp/researchlab-data-worktree

          git fetch origin researchlab-data
          git worktree add /tmp/researchlab-data-worktree origin/researchlab-data

          stamp="$(date -u +"%Y%m%dT%H%M%SZ")"
          mkdir -p /tmp/researchlab-data-worktree/cloud-backtest/research_lab_data/audits
          cp research_audit_output/research_audit.md \
            "/tmp/researchlab-data-worktree/cloud-backtest/research_lab_data/audits/${stamp}.md"
          cp research_audit_output/research_audit.json \
            "/tmp/researchlab-data-worktree/cloud-backtest/research_lab_data/audits/${stamp}.json"
          cp research_audit_output/research_audit.md \
            /tmp/researchlab-data-worktree/cloud-backtest/research_lab_data/latest_research_audit.md
          cp research_audit_output/research_audit.json \
            /tmp/researchlab-data-worktree/cloud-backtest/research_lab_data/latest_research_audit.json

          cd /tmp/researchlab-data-worktree
          git add cloud-backtest/research_lab_data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish ResearchLab audit [skip ci]'

          for i in 1 2 3; do
            if git push origin HEAD:researchlab-data; then exit 0; fi
            git fetch origin researchlab-data || true
            if git rebase origin/researchlab-data; then continue; fi
            git rebase --abort || true
          done
          exit 1
