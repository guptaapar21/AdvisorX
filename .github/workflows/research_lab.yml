name: AdvisorX ResearchLab

on:
  workflow_dispatch:

permissions:
  contents: write

# ResearchLab and Audit both write researchlab-data; serialize their writes.
concurrency:
  group: advisorx-researchlab-data
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ResearchLab data branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloud-backtest/research_lab_data
          mkdir -p cloud-backtest/research_lab_data

          if git ls-remote --exit-code --heads origin researchlab-data >/dev/null 2>&1; then
            git fetch origin researchlab-data
            git archive origin/researchlab-data -- cloud-backtest/research_lab_data \
              | tar -x --strip-components=2 -C cloud-backtest/research_lab_data
            rm -rf cloud-backtest/research_lab_data/cloud-backtest
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: researchlab-pip-${{ runner.os }}-${{ hashFiles('cloud-backtest/research_lab/requirements.txt') }}
          restore-keys: |
            researchlab-pip-${{ runner.os }}-

      - name: Install ResearchLab dependencies
        run: python -m pip install -r cloud-backtest/research_lab/requirements.txt

      - name: Run ResearchLab tests and collector
        env:
          PYTHONPATH: cloud-backtest
          RESEARCH_COINS: BTC,ETH,BNB,SOL,XRP,DOGE,LTC,LINK,TRX,AVAX,HYPE,ZEC,ADA,ACE,PAXG
          RESEARCH_OBSERVATION_LOOKBACK_MIN: '120'
          RESEARCH_TAKER_FEE: '0.00075'
          RESEARCH_ANALYSIS_UTC_HOUR: '0'
          RESEARCH_ANALYSIS_INTERVAL_MIN: '60'
          RESEARCH_MIN_NEW_OUTCOMES_FOR_ANALYSIS: '1000'
          RESEARCH_HOLDOUT_TEST_BUDGET_PER_EPOCH: '10'
          RESEARCH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEYS }}
          RESEARCH_GEMINI_MODEL: gemini-3.5-flash-lite
          RESEARCH_GEMINI_MAX_PASSES: '2'
          RESEARCH_DISCOVERY_PASSES: '2'
          RESEARCH_DISCOVERY_PASS_CANDIDATES: '120'
          RESEARCH_DISCOVERY_INPUT_CHAR_BUDGET: '100000'
          RESEARCH_HOLDOUT_FINALISTS: '10'
        run: |
          python -m pytest \
            cloud-backtest/research_lab/test_research_lab.py \
            cloud-backtest/research_lab/test_research_store_paths.py \
            cloud-backtest/research_lab/test_research_engine_v4.py \
            cloud-backtest/research_lab/test_research_cadence.py -q
          python -m research_lab.run

      - name: Verify persistent research data
        shell: bash
        run: |
          set -euo pipefail
          test -s cloud-backtest/research_lab_data/observations.jsonl
          echo "Observations: $(wc -l < cloud-backtest/research_lab_data/observations.jsonl)"
          echo "Outcomes: $(wc -l < cloud-backtest/research_lab_data/outcomes.jsonl 2>/dev/null || echo 0)"

      # The external cron controls the 5-minute execution cadence.
      # Persistence is therefore performed on every successful run.
      # Research timing is handled independently inside run.py.
      - name: Drop transient candle cache before Git persistence
        run: rm -rf cloud-backtest/research_lab_data/candles_1m

      - name: Persist ResearchLab data to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'advisorx-research-bot'
          git config user.email 'actions@github.com'
          rm -rf /tmp/researchlab-data-worktree

          if git ls-remote --exit-code --heads origin researchlab-data >/dev/null 2>&1; then
            git fetch origin researchlab-data
            git worktree add /tmp/researchlab-data-worktree origin/researchlab-data
          else
            git worktree add -b researchlab-data origin/main /tmp/researchlab-data-worktree
          fi

          rm -rf /tmp/researchlab-data-worktree/cloud-backtest/research_lab_data
          mkdir -p /tmp/researchlab-data-worktree/cloud-backtest

          cp -a cloud-backtest/research_lab_data \
            /tmp/researchlab-data-worktree/cloud-backtest/research_lab_data
          rm -rf /tmp/researchlab-data-worktree/cloud-backtest/research_lab_data/candles_1m

          cd /tmp/researchlab-data-worktree
          git add cloud-backtest/research_lab_data

          if git diff --cached --quiet; then
            echo 'No ResearchLab data changes.'
            exit 0
          fi

          git commit -m 'Update ResearchLab data [skip ci]'

          for i in 1 2 3; do
            if git push origin HEAD:researchlab-data; then
              exit 0
            fi

            git fetch origin researchlab-data || true

            if git rebase origin/researchlab-data; then
              continue
            fi

            git rebase --abort || true
          done

          echo 'ResearchLab data push failed after retries.'
          exit 1
