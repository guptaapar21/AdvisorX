name: Idea 9 - BTC Lag Confirmation (DOGE only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline (no lag bonus)
          - { test: "doge_baseline", lag_bonus: 0, lag_bars: 6 }
          # Sweep lag window - 3/6/12/24 bars (5m bars: 15min/30min/1h/2h lookback)
          - { test: "doge_lag_3bars", lag_bonus: 10, lag_bars: 3 }
          - { test: "doge_lag_6bars", lag_bonus: 10, lag_bars: 6 }
          - { test: "doge_lag_12bars", lag_bonus: 10, lag_bars: 12 }
          - { test: "doge_lag_24bars", lag_bonus: 10, lag_bars: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run backtest (${{ matrix.test }})
        working-directory: cloud-backtest
        env:
          BT_COINS: "DOGE"
          BT_STRATEGIES: conservative
          BT_DAYS: ${{ inputs.days }}
          BT_MIN_SCORE_OVERRIDE: "79"
          BT_MAX_HOLD_HOURS: "48"
          BT_ATR_OVERRIDE: "2.5"
          BT_USE_BTC_LAG_BONUS: ${{ matrix.lag_bonus != 0 && 'true' || 'false' }}
          BT_BTC_LAG_BONUS: ${{ matrix.lag_bonus }}
          BT_BTC_LAG_BARS: ${{ matrix.lag_bars }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit results
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-backtest-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet && exit 0
          git commit -m "Idea 9 BTC lag: ${{ matrix.test }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            if git pull --rebase; then continue; fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add results/
            git commit -m "Idea 9 BTC lag: ${{ matrix.test }} [skip ci]" --allow-empty
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: idea9-btc-lag-${{ matrix.test }}
          path: cloud-backtest/results/
          retention-days: 90
