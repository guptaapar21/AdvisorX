name: AdvisorX Cloud Backtest

on:
  workflow_dispatch:
    inputs:
      coins:
        description: 'General-purpose sweep input - crossed with min_scores/max_hold_hours below. IGNORED if coin_configs (below) is non-empty - use coin_configs instead to run all 3 coins at their own correct real settings together in one run.'
        required: false
        default: '["SOL","DOGE","ETH"]'
      coin_configs:
        description: 'PREFERRED for "run everything at its real settings": JSON array of {"coin","min_score","max_hold_hours"} objects, tested as PAIRS (not crossed with each other) - e.g. SOL only at score 80/18h, DOGE only at 79/48h, ETH only at 81/60h, not all 27 cross-combinations. Leave as [] to fall back to the general coins/min_scores/max_hold_hours sweep instead.'
        required: false
        default: '[{"coin":"SOL","min_score":80,"max_hold_hours":18},{"coin":"DOGE","min_score":79,"max_hold_hours":48},{"coin":"ETH","min_score":81,"max_hold_hours":60}]'
      strategies:
        description: 'JSON array of presets to sweep. Locked to conservative only - the proven winner, not re-exploring.'
        required: false
        default: '["conservative"]'
      min_scores:
        description: 'General-purpose sweep input - IGNORED if coin_configs is non-empty.'
        required: false
        default: '[79, 80, 81]'
      atr_values:
        description: "Fixed to conservative's real default (2.5x) - already confirmed the right setting, not re-sweeping it."
        required: false
        default: '[2.5]'
      full_close_modes:
        description: 'Fixed to staged (false) only - already confirmed the winner in every comparison, not re-testing full-close.'
        required: false
        default: '[false]'
      asymmetric_free_ride_modes:
        description: "Fixed to false only - conclusively rejected in direct testing (SOL@80/18h: +$238 staged exit vs +$37 asymmetric, same win rate). Not re-testing; this run needs clean current-strategy trades."
        required: false
        default: '[false]'
      stage1_close_fraction:
        description: "Only used when asymmetric_free_ride_modes includes true - fraction of the position closed at 1R (0.65 = 65%)."
        required: false
        default: "0.65"
      trailing_atr_multiplier:
        description: "Only used when asymmetric_free_ride_modes includes true - how many ATRs behind price the trailing stop sits."
        required: false
        default: "1.5"
      reversal_threshold:
        description: "Reversal score that triggers an exit. Investigation closed: 70 is the best-performing setting found (confirmed live default) and lowering it (tested down to 30) is a net negative on every coin. Reset to [70] only - re-add lower values here explicitly if you want to re-open that question."
        required: false
        default: '[70]'
      raw_reversal_threshold:
        description: "Already tested and settled - the bucketed reversal check won every comparison against the raw continuous version. Disabled for this run, not re-testing."
        required: false
        default: '[]'
      skip_filter_timeframe:
        description: "Already confirmed the 1h filter timeframe earns its cost - fixed to false, not re-testing."
        required: false
        default: '[false]'
      timeframe_combos:
        description: "(3,10,30) is now conclusively rejected - 10 for 10 losing results across every coin/score/hold-time combination tested. Fixed to the real deployed baseline only for this run."
        required: false
        default: '[[5,15,60]]'
      days:
        description: "Lookback window in days (365 = 1 year, the agreed compute-budget cap)"
        required: false
        default: "365"
      max_hold_hours:
        description: "General-purpose sweep input - IGNORED if coin_configs is non-empty."
        required: false
        default: '[18, 48, 60]'
      adverse_drift_modes:
        description: "NEW (Aug 2 fix): the direction-aware multi-cycle drift detector added to calculate_reversal_score, on top of the existing bucketed reversal check. Default runs BOTH false and true as separate matrix jobs, so results/ ends up with a real before/after pair per coin - not a guess, an actual paired comparison over the same 2-year window. false = current live behavior exactly (untouched)."
        required: false
        default: '[false, true]'
      drift_net_threshold:
        description: "Only matters when adverse_drift_modes includes true. Tuned against exactly one real trade (the ETH short that motivated this fix) - treat 10 as a hypothesis, not settled. List multiple values to sweep sensitivity in the same run, e.g. '[8, 10, 15]'."
        required: false
        default: '[10]'
      dynamic_threshold_modes:
        description: "Idea #2: keep reversal_threshold=70 for fresh trades, but drop it to dynamic_threshold_tightened once a trade is BOTH older than dynamic_threshold_after_minutes AND already at/below dynamic_threshold_drawdown_r. Default OFF only - set to '[false, true]' via the Actions UI to actually test this one feature in isolation (crossing all 5 new toggles at once by default would explode job count and conflate results)."
        required: false
        default: '[false]'
      dynamic_threshold_after_minutes:
        description: "Idea #2 param: minutes a trade must be open before the tightened threshold can apply."
        required: false
        default: "45"
      dynamic_threshold_drawdown_r:
        description: "Idea #2 param: current R must be at or below this (negative) before the tightened threshold can apply."
        required: false
        default: "-0.4"
      dynamic_threshold_tightened:
        description: "Idea #2 param: the tightened reversal_score exit threshold once both gate conditions are met."
        required: false
        default: "35"
      drift_stop_tighten_modes:
        description: "Idea #3: when an adverse-drift branch fires, compress the stop toward drift_stop_tighten_atr_multiplier x ATR instead of contributing only to the exit score. Only takes effect when adverse_drift_modes includes true for that job. Default OFF only - set to '[false, true]' via the Actions UI to test this feature in isolation."
        required: false
        default: '[false]'
      drift_stop_tighten_atr_multiplier:
        description: "Idea #3 param: ATR multiplier for the compressed stop (default preset uses 2.5x normally - this tightens it)."
        required: false
        default: "1.2"
      obv_confirmation_bonus:
        description: "Idea #4: extra reversal-score points added when OBV (NOT real CVD - CoinDCX's public candles have no taker buy/sell split, see indicators.py) confirms the adverse price move. 0 = disabled (default, matches current live behavior). List multiple values to sweep, e.g. '[0, 8, 15]'."
        required: false
        default: '[0]'
      soft_exit_modes:
        description: "Idea #5: mechanical TRIM/TIGHTEN/FREEZE proxy - a RULE-BASED stand-in for what Gemini might decide, not a simulation of the LLM itself. Default OFF only - set to '[false, true]' via the Actions UI to test this feature in isolation."
        required: false
        default: '[false]'
      soft_exit_trim_threshold:
        description: "Idea #5 param: reversal_score at which 50% (soft_exit_trim_fraction) of the position is realized early."
        required: false
        default: "45"
      soft_exit_tighten_threshold:
        description: "Idea #5 param: reversal_score at which the stop is tightened to soft_exit_tighten_atr_multiplier x ATR."
        required: false
        default: "35"

jobs:
  # Builds the full cross-product (coin x strategy x min_score x atr x
  # full_close) as a single JSON list - default inputs give
  # 2 coins x 2 strategies x 4 min_scores x 3 atr x 2 full_close = 96
  # combinations, each its own independent parallel job.
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - id: build
        env:
          # Env vars, not inline ${{ }} substitution inside the script
          # body - the JSON inputs contain double quotes, which collide
          # with a `python3 -c "..."` shell string's own quoting and
          # break the command (this bit us once already - see the fix
          # history). Env vars sidestep shell-quoting entirely.
          IN_COINS: ${{ inputs.coins }}
          IN_STRATEGIES: ${{ inputs.strategies }}
          IN_MIN_SCORES: ${{ inputs.min_scores }}
          IN_COIN_CONFIGS: ${{ inputs.coin_configs }}
          IN_ATR_VALUES: ${{ inputs.atr_values }}
          IN_FULL_CLOSE_MODES: ${{ inputs.full_close_modes }}
          IN_ASYMMETRIC_FREE_RIDE_MODES: ${{ inputs.asymmetric_free_ride_modes }}
          IN_STAGE1_CLOSE_FRACTION: ${{ inputs.stage1_close_fraction }}
          IN_TRAILING_ATR_MULTIPLIER: ${{ inputs.trailing_atr_multiplier }}
          IN_REVERSAL_THRESHOLD: ${{ inputs.reversal_threshold }}
          IN_RAW_REVERSAL_THRESHOLD: ${{ inputs.raw_reversal_threshold }}
          IN_SKIP_FILTER_TIMEFRAME: ${{ inputs.skip_filter_timeframe }}
          IN_TIMEFRAME_COMBOS: ${{ inputs.timeframe_combos }}
          IN_MAX_HOLD_HOURS: ${{ inputs.max_hold_hours }}
          IN_ADVERSE_DRIFT_MODES: ${{ inputs.adverse_drift_modes }}
          IN_DRIFT_NET_THRESHOLD: ${{ inputs.drift_net_threshold }}
          IN_DYNAMIC_THRESHOLD_MODES: ${{ inputs.dynamic_threshold_modes }}
          IN_DRIFT_STOP_TIGHTEN_MODES: ${{ inputs.drift_stop_tighten_modes }}
          IN_OBV_CONFIRMATION_BONUS: ${{ inputs.obv_confirmation_bonus }}
          IN_SOFT_EXIT_MODES: ${{ inputs.soft_exit_modes }}
        run: |
          cat > /tmp/generate_matrix.py << 'PYEOF'
          import json, os

          coins = json.loads(os.environ["IN_COINS"])
          strategies = json.loads(os.environ["IN_STRATEGIES"])
          min_scores = json.loads(os.environ["IN_MIN_SCORES"])
          atr_values = json.loads(os.environ["IN_ATR_VALUES"])
          full_close_modes = json.loads(os.environ["IN_FULL_CLOSE_MODES"])
          asymmetric_free_ride_modes = json.loads(os.environ["IN_ASYMMETRIC_FREE_RIDE_MODES"])
          stage1_close_fraction = os.environ["IN_STAGE1_CLOSE_FRACTION"]
          trailing_atr_multiplier = os.environ["IN_TRAILING_ATR_MULTIPLIER"]
          reversal_thresholds = json.loads(os.environ["IN_REVERSAL_THRESHOLD"])
          raw_reversal_thresholds = json.loads(os.environ["IN_RAW_REVERSAL_THRESHOLD"]) or [None]
          skip_filter_modes = json.loads(os.environ["IN_SKIP_FILTER_TIMEFRAME"])
          timeframe_combos = json.loads(os.environ["IN_TIMEFRAME_COMBOS"])
          max_hold_hours_values = json.loads(os.environ["IN_MAX_HOLD_HOURS"])
          coin_configs = json.loads(os.environ["IN_COIN_CONFIGS"])
          adverse_drift_modes = json.loads(os.environ["IN_ADVERSE_DRIFT_MODES"])
          drift_net_thresholds = json.loads(os.environ["IN_DRIFT_NET_THRESHOLD"])
          dynamic_threshold_modes = json.loads(os.environ["IN_DYNAMIC_THRESHOLD_MODES"])
          drift_stop_tighten_modes = json.loads(os.environ["IN_DRIFT_STOP_TIGHTEN_MODES"])
          obv_confirmation_bonuses = json.loads(os.environ["IN_OBV_CONFIRMATION_BONUS"])
          soft_exit_modes = json.loads(os.environ["IN_SOFT_EXIT_MODES"])

          # If coin_configs is provided, use it as PAIRED (coin, min_score,
          # max_hold_hours) triples - e.g. SOL only at 80/18h, DOGE only at
          # 79/48h, ETH only at 81/60h, not the full 3x3x3=27-combination
          # cross-product the general sweep inputs would otherwise produce.
          # Falls back to the original crossed sweep when coin_configs is
          # empty, so existing parameter-exploration runs are unaffected.
          if coin_configs:
              coin_score_hold_triples = [(c["coin"], c["min_score"], c["max_hold_hours"]) for c in coin_configs]
              print(f"Using coin_configs: {len(coin_score_hold_triples)} paired coin/score/hold combination(s), not a cross-product.")
          else:
              coin_score_hold_triples = [(coin, min_score, max_hold) for coin in coins for min_score in min_scores for max_hold in max_hold_hours_values]
              print(f"coin_configs empty - falling back to the general crossed sweep: {len(coins)} coins x {len(min_scores)} scores x {len(max_hold_hours_values)} hold times.")

          combos = []
          for coin, min_score, max_hold in coin_score_hold_triples:
              for strategy in strategies:
                  for atr in atr_values:
                      for full_close in full_close_modes:
                          for asym_mode in asymmetric_free_ride_modes:
                              for reversal in reversal_thresholds:
                                  for raw_reversal in raw_reversal_thresholds:
                                      for skip_filter in skip_filter_modes:
                                          for tf in timeframe_combos:
                                              for drift_mode in adverse_drift_modes:
                                                  thresholds_to_use = drift_net_thresholds if drift_mode else [drift_net_thresholds[0]]
                                                  for drift_threshold in thresholds_to_use:
                                                      # Idea #3 only means anything when adverse_drift is
                                                      # actually on for this job - same dedup logic as
                                                      # drift_net_threshold above (don't multiply an
                                                      # irrelevant toggle against a False drift_mode).
                                                      tighten_modes_to_use = drift_stop_tighten_modes if drift_mode else [False]
                                                      for tighten_mode in tighten_modes_to_use:
                                                          for dyn_mode in dynamic_threshold_modes:
                                                              for obv_bonus in obv_confirmation_bonuses:
                                                                  for soft_mode in soft_exit_modes:
                                                                      combos.append({
                                                                          "coin": coin, "strategy": strategy,
                                                                          "min_score": str(min_score),
                                                                          "atr": str(atr), "full_close": str(full_close).lower(),
                                                                          "asym_free_ride": str(asym_mode).lower(),
                                                                          "stage1_frac": stage1_close_fraction,
                                                                          "trail_atr": trailing_atr_multiplier,
                                                                          "reversal": str(reversal),
                                                                          "raw_reversal": "" if raw_reversal is None else str(raw_reversal),
                                                                          "skip_filter": str(skip_filter).lower(),
                                                                          "primary_min": str(tf[0]), "confirm_min": str(tf[1]), "filter_min": str(tf[2]),
                                                                          "max_hold_hours": str(max_hold),
                                                                          "adverse_drift": str(drift_mode).lower(),
                                                                          "drift_threshold": str(drift_threshold),
                                                                          "drift_stop_tighten": str(tighten_mode).lower(),
                                                                          "dynamic_threshold": str(dyn_mode).lower(),
                                                                          "obv_bonus": str(obv_bonus),
                                                                          "soft_exit": str(soft_mode).lower(),
                                                                      })

          matrix = {"include": combos}
          print(f"Generated {len(combos)} combinations")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"count={len(combos)}\n")
          PYEOF
          python3 /tmp/generate_matrix.py

  backtest:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false  # one combo failing/timing out must never cancel the others
    # One (coin, strategy) pair with ONE min_score/atr/exit-mode combo is a
    # single-variant run - roughly the same cost as one preset in the
    # original per-coin job (~8-10 min for a full year). 60 min is
    # generous headroom, nowhere near GitHub's 360-min hard ceiling.
    # Bumped from 60 to 150 minutes: the (1,5,15) timeframe combo runs
    # ~5x more loop iterations than the default (5,15,60), and real
    # observed timing (a full-year 5m-primary DOGE run took ~18 min
    # total) means the 1m-primary combo could approach or exceed the old
    # 60-min limit and get silently killed with zero results - exactly
    # the combo this feature was built to test.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt

      - name: Run backtest (${{ matrix.coin }} / ${{ matrix.strategy }} / score ${{ matrix.min_score }} / hold=${{ matrix.max_hold_hours }}h / drift=${{ matrix.adverse_drift }}-${{ matrix.drift_threshold }} / dtighten=${{ matrix.drift_stop_tighten }} / dynthresh=${{ matrix.dynamic_threshold }} / obv=${{ matrix.obv_bonus }} / softexit=${{ matrix.soft_exit }})
        working-directory: cloud-backtest
        env:
          BT_COINS: ${{ matrix.coin }}
          BT_STRATEGIES: ${{ matrix.strategy }}
          BT_DAYS: ${{ inputs.days }}
          BT_MAX_HOLD_HOURS: ${{ matrix.max_hold_hours }}
          BT_ATR_OVERRIDE: ${{ matrix.atr }}
          BT_MIN_SCORE_OVERRIDE: ${{ matrix.min_score }}
          BT_REVERSAL_THRESHOLD: ${{ matrix.reversal }}
          BT_RAW_REVERSAL_THRESHOLD: ${{ matrix.raw_reversal }}
          BT_SKIP_FILTER_TIMEFRAME: ${{ matrix.skip_filter }}
          BT_PRIMARY_MINUTES: ${{ matrix.primary_min }}
          BT_CONFIRM_MINUTES: ${{ matrix.confirm_min }}
          BT_FILTER_MINUTES: ${{ matrix.filter_min }}
          BT_FULL_CLOSE_AT_1R: ${{ matrix.full_close }}
          BT_ASYMMETRIC_FREE_RIDE: ${{ matrix.asym_free_ride }}
          BT_STAGE1_CLOSE_FRACTION: ${{ matrix.stage1_frac }}
          BT_TRAILING_ATR_MULTIPLIER: ${{ matrix.trail_atr }}
          BT_USE_ADVERSE_DRIFT: ${{ matrix.adverse_drift }}
          BT_DRIFT_NET_THRESHOLD: ${{ matrix.drift_threshold }}
          BT_DRIFT_STOP_TIGHTEN_ENABLED: ${{ matrix.drift_stop_tighten }}
          BT_DRIFT_STOP_TIGHTEN_ATR_MULTIPLIER: ${{ inputs.drift_stop_tighten_atr_multiplier }}
          BT_DYNAMIC_THRESHOLD_ENABLED: ${{ matrix.dynamic_threshold }}
          BT_DYNAMIC_THRESHOLD_AFTER_MINUTES: ${{ inputs.dynamic_threshold_after_minutes }}
          BT_DYNAMIC_THRESHOLD_DRAWDOWN_R: ${{ inputs.dynamic_threshold_drawdown_r }}
          BT_DYNAMIC_THRESHOLD_TIGHTENED: ${{ inputs.dynamic_threshold_tightened }}
          BT_OBV_CONFIRMATION_BONUS: ${{ matrix.obv_bonus }}
          BT_SOFT_EXIT_ENABLED: ${{ matrix.soft_exit }}
          BT_SOFT_EXIT_TRIM_THRESHOLD: ${{ inputs.soft_exit_trim_threshold }}
          BT_SOFT_EXIT_TIGHTEN_THRESHOLD: ${{ inputs.soft_exit_tighten_threshold }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit results
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-backtest-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet && exit 0
          git commit -m "Add backtest results: ${{ matrix.coin }}/${{ matrix.strategy }} score${{ matrix.min_score }} drift=${{ matrix.adverse_drift }}-${{ matrix.drift_threshold }} dtighten=${{ matrix.drift_stop_tighten }} dynthresh=${{ matrix.dynamic_threshold }} obv=${{ matrix.obv_bonus }} softexit=${{ matrix.soft_exit }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), pulling and retrying..."
            if git pull --rebase; then
              continue
            fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add results/
            git commit -m "Add backtest results: ${{ matrix.coin }}/${{ matrix.strategy }} score${{ matrix.min_score }} drift=${{ matrix.adverse_drift }}-${{ matrix.drift_threshold }} dtighten=${{ matrix.drift_stop_tighten }} dynthresh=${{ matrix.dynamic_threshold }} obv=${{ matrix.obv_bonus }} softexit=${{ matrix.soft_exit }} [skip ci]" --allow-empty
          done
          echo "Failed to push results after 5 attempts."
          exit 1

      - name: Upload results as workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ matrix.coin }}-${{ matrix.strategy }}-score${{ matrix.min_score }}-drift${{ matrix.adverse_drift }}-${{ matrix.drift_threshold }}-dtighten${{ matrix.drift_stop_tighten }}-dyn${{ matrix.dynamic_threshold }}-obv${{ matrix.obv_bonus }}-soft${{ matrix.soft_exit }}
          path: cloud-backtest/results/
          retention-days: 90
