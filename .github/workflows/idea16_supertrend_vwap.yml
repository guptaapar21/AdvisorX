name: Idea 16 - SuperTrend + VWAP filter (SOL only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run 24-combo sweep for SOL (one fetch, VWAP tested with and without)
        working-directory: cloud-backtest
        run: >
          python run_supertrend_vwap_backtest.py
          --coin SOL
          --days ${{ inputs.days }}
          --sweep-all
