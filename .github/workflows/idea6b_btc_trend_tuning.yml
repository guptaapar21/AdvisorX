name: Idea 6b - BTC Trend Bonus Tuning (all coins)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- ETH: is the +16.4% real or a fluke? Sweep both real knobs
          # this idea actually has (NOT lookback/slope_threshold - those
          # are OBV's parameters, not BTC trend bonus's - see the two
          # actual knobs below). ----
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, btc_bonus: 10, btc_magnitude: 25 }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, btc_bonus: 5,  btc_magnitude: 25 }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, btc_bonus: 15, btc_magnitude: 25 }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, btc_bonus: 10, btc_magnitude: 20 }
          - { coin: "ETH", min_score: 81, max_hold_hours: 60, btc_bonus: 10, btc_magnitude: 30 }

          # ---- SOL: is the -9.5% a real, repeatable negative (like OBV's
          # SOL result turned out to be) or just noise from one setting? ----
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, btc_bonus: 10, btc_magnitude: 25 }
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, btc_bonus: 5,  btc_magnitude: 25 }
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, btc_bonus: 15, btc_magnitude: 25 }
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, btc_bonus: 10, btc_magnitude: 20 }
          - { coin: "SOL", min_score: 80, max_hold_hours: 18, btc_bonus: 10, btc_magnitude: 30 }

          # ---- DOGE: same question as SOL ----
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, btc_bonus: 10, btc_magnitude: 25 }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, btc_bonus: 5,  btc_magnitude: 25 }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, btc_bonus: 15, btc_magnitude: 25 }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, btc_bonus: 10, btc_magnitude: 20 }
          - { coin: "DOGE", min_score: 79, max_hold_hours: 48, btc_bonus: 10, btc_magnitude: 30 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r cloud-backtest/requirements.txt
      - name: Run backtest (${{ matrix.coin }} / btc_bonus=${{ matrix.btc_bonus }} / btc_magnitude=${{ matrix.btc_magnitude }})
        working-directory: cloud-backtest
        env:
          BT_COINS: ${{ matrix.coin }}
          BT_STRATEGIES: conservative
          BT_DAYS: ${{ inputs.days }}
          BT_MIN_SCORE_OVERRIDE: ${{ matrix.min_score }}
          BT_MAX_HOLD_HOURS: ${{ matrix.max_hold_hours }}
          BT_ATR_OVERRIDE: "2.5"
          BT_USE_BTC_TREND_BONUS: "true"
          BT_BTC_TREND_BONUS: ${{ matrix.btc_bonus }}
          BT_BTC_MIN_SCORE_MAGNITUDE: ${{ matrix.btc_magnitude }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit results
        working-directory: cloud-backtest
        run: |
          git config user.name "coindcx-backtest-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet && exit 0
          git commit -m "Idea 6b BTC trend tuning: ${{ matrix.coin }} bonus=${{ matrix.btc_bonus }} mag=${{ matrix.btc_magnitude }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            if git pull --rebase; then continue; fi
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add results/
            git commit -m "Idea 6b BTC trend tuning: ${{ matrix.coin }} bonus=${{ matrix.btc_bonus }} mag=${{ matrix.btc_magnitude }} [skip ci]" --allow-empty
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: idea6b-btc-trend-${{ matrix.coin }}-b${{ matrix.btc_bonus }}-m${{ matrix.btc_magnitude }}
          path: cloud-backtest/results/
          retention-days: 90
