name: CoinDCX Fast Position Watcher (advisory only)

on:
  workflow_dispatch: {}
  # No schedule here either - triggered by a SECOND external cron-job.org
  # job pointed at this workflow specifically, on a faster interval (e.g.
  # every ~2 minutes) than the main agent workflow. Costs 0 Gemini calls -
  # pure arithmetic against real prices, so a tight interval is safe.

permissions:
  contents: write

concurrency:
  # Renamed from coindcx-fastwatch - runs #8059/#8102 got permanently
  # wedged (GitHub couldn't even Cancel them) and were blocking every
  # later run indefinitely. Renaming the group orphans those stuck runs
  # in the old group forever and starts a fresh queue here - immediate
  # fix, doesn't depend on the stuck runs ever actually terminating.
  group: coindcx-fastwatch-v2
  cancel-in-progress: false

jobs:
  fastwatch:
    runs-on: ubuntu-latest
    # A run that hangs used to sit forever and jam this entire concurrency
    # group - every later trigger queued behind it indefinitely and got
    # pruned by GitHub itself ("Cancelling since a higher priority waiting
    # request exists"), which is what happened with run #8059. This forces
    # GitHub to kill a hung run itself. Normal runs finish in well under a
    # minute; 4 min is generous headroom, not a normal duration.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run fast position watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
          COINDCX_API_SECRET: ${{ secrets.COINDCX_API_SECRET }}
        run: node fastWatchIndex.js

      - name: Persist fast-watch state
        run: |
          git config user.name "coindcx-fastwatch-bot"
          git config user.email "actions@github.com"
          [ -f fastWatchState.json ] && git add fastWatchState.json
          git diff --staged --quiet && exit 0
          git commit -m "Update fast-watch state [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), pulling and retrying..."
            git pull --rebase
          done
          echo "Failed to push state after 3 attempts."
          exit 1
