<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdvisorX</title>
<style>
  :root {
    --bg: #0b0e11;
    --card: #14181d;
    --line: #232830;
    --text: #e8eaed;
    --muted: #7d8590;
    --up: #16c784;
    --down: #ea3943;
    --amber: #f0b90b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    font-size: 13px;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding: 6px; min-height: 100vh; }
  .num {
    font-family: 'IBM Plex Mono', 'Roboto Mono', monospace;
    font-variant-numeric: tabular-nums;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1px 2px 6px;
  }
  .brand { font-weight: 700; letter-spacing: 0.02em; font-size: 13px; }
  .brand span { color: var(--amber); }
  .live { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--up);
    box-shadow: 0 0 0 0 rgba(22,199,132,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(22,199,132,0.5); }
    70% { box-shadow: 0 0 0 5px rgba(22,199,132,0); }
    100% { box-shadow: 0 0 0 0 rgba(22,199,132,0); }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 5px;
  }
  .pos-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .pos-symbol { font-size: 15px; font-weight: 700; }
  .pos-dir {
    font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    padding: 1px 6px; border-radius: 4px; margin-left: 6px;
  }
  .dir-long { background: rgba(22,199,132,0.15); color: var(--up); }
  .dir-short { background: rgba(234,57,67,0.15); color: var(--down); }
  .pnl-block { text-align: right; }
  .pnl-rupee { font-size: 16px; font-weight: 700; line-height: 1.05; }
  .pnl-pct { font-size: 11px; }
  .up-text { color: var(--up); }
  .down-text { color: var(--down); }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    border-top: 1px solid var(--line); padding-top: 6px;
  }
  .grid-item .label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .grid-item .value { font-size: 12.5px; font-weight: 600; }
  .flat-row { display: flex; align-items: center; justify-content: space-between; }
  .flat-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted);
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px;
  }
  .tag {
    display: flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.05em; color: var(--amber); text-transform: uppercase; margin-bottom: 5px;
  }
  .tag::before { content: ""; width: 3px; height: 10px; background: var(--amber); border-radius: 2px; display: inline-block; }
  .tag.muted { color: #9aa4af; }
  .tag.muted::before { background: #9aa4af; }
  .verdict-line { font-size: 12px; font-weight: 700; line-height: 1.3; }
  .verdict-sub { font-size: 11px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
  .scores-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .score-chip {
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
    padding: 3px 7px; font-size: 11px; display: flex; gap: 4px; align-items: baseline;
  }
  .score-chip .sym { font-weight: 700; }
  .score-chip .val { color: var(--muted); }
  .footer { text-align: center; font-size: 9px; color: var(--muted); padding: 3px 0 1px; }
  .err { text-align: center; color: var(--down); font-size: 11px; padding: 8px; }
</style>
</head>
<body>

  <div class="top">
    <div class="brand">Advisor<span>X</span></div>
    <div class="live"><div class="dot"></div><span id="updatedAgo">--</span></div>
  </div>

  <div class="card" id="positionCard">
    <div class="flat-row"><span style="color:var(--muted)">Loading…</span></div>
  </div>

  <div class="card">
    <div class="tag">AI verdict</div>
    <div id="reasoningText">Loading…</div>
  </div>

  <div class="card">
    <div class="tag muted">Scores</div>
    <div class="scores-row" id="scoresRow"></div>
  </div>

  <div class="footer" id="footerNote">fetching…</div>

<script>
  // raw.githubusercontent.com sits behind GitHub's Fastly CDN, which can
  // serve edge-cached content several minutes old regardless of query-string
  // cache-busting - confirmed as expected GitHub behavior, not something a
  // client can force around. The Contents API isn't cached the same way, so
  // it's used instead - at the cost of a slower poll interval to stay under
  // its 60 req/hour unauthenticated rate limit (75s gives real margin).
  const SNAPSHOT_URL = "https://api.github.com/repos/guptaapar21/AdvisorX/contents/liveSnapshot.json?ref=main";
  const FX_URL = "https://open.er-api.com/v6/latest/USD";

  let usdInr = 87;
  let lastSnapshot = null;

  function fmtMoney(n, decimals) {
    if (n === null || n === undefined || isNaN(n)) return "--";
    return n.toLocaleString("en-IN", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function fmtPrice(n) {
    if (n === null || n === undefined || isNaN(n)) return "--";
    const decimals = n < 10 ? 4 : n < 1000 ? 3 : 2;
    return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function symbolFromContract(contract) {
    if (!contract) return "--";
    return contract.replace(/^[A-Z]-/, "").replace(/_USDT$/, "");
  }

  function timeAgo(ts) {
    if (!ts) return "--";
    const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return s + "s";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "m";
    const h = Math.floor(m / 60);
    return h + "h";
  }

  // Telegram-style reasoning looks like:
  //   "NO ACTION — no positions, no setups cleared threshold.
  //   Reason: Best candidate XRP scored 74 (trend_following), below the
  //   required 75.
  //   Scores: XRP 74, BTC 73, ETH 67, SOL 51, DOGE 50"
  // The verdict line (before the first \n) already IS the crisp summary.
  // The "Reason:" paragraph restates it in longer prose, and "Scores:"
  // duplicates the separate scores card below - both dropped so this
  // reads as one short verdict, not three redundant sentences.
  function condenseReasoning(raw) {
    if (!raw) return { verdict: "No verdict recorded yet.", sub: "" };
    const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
    const first = lines[0] || raw;
    const dashIdx = first.indexOf("—");
    const verdict = dashIdx >= 0 ? first.slice(0, dashIdx).trim() : first;
    const sub = dashIdx >= 0 ? first.slice(dashIdx + 1).trim() : "";
    return { verdict, sub };
  }

  function renderPosition(data) {
    const el = document.getElementById("positionCard");
    const pos = data.positions && data.positions[0];

    if (!pos) {
      el.innerHTML = `<div class="flat-row"><span style="font-weight:600">No position</span><span class="flat-badge">FLAT</span></div>`;
      return;
    }

    const isLong = pos.action === "long";
    const dirClass = isLong ? "dir-long" : "dir-short";
    const dirLabel = isLong ? "LONG" : "SHORT";
    const symbol = symbolFromContract(pos.contract);

    const pnlUsdt = pos.pnlUsdt;
    const pnlPct = pos.pnlPercent;
    const pnlInr = pnlUsdt != null ? pnlUsdt * usdInr : null;
    const isUp = (pnlPct ?? 0) >= 0;
    const pnlClass = isUp ? "up-text" : "down-text";
    const sign = isUp ? "+" : "";

    el.innerHTML = `
      <div class="pos-head">
        <div>
          <span class="pos-symbol num">${symbol}</span>
          <span class="pos-dir ${dirClass}">${dirLabel}</span>
        </div>
        <div class="pnl-block">
          <div class="pnl-rupee num ${pnlClass}">${sign}₹${fmtMoney(Math.abs(pnlInr ?? 0), 0)}</div>
          <div class="pnl-pct num ${pnlClass}">${sign}${fmtMoney(pnlPct, 2)}%</div>
        </div>
      </div>
      <div class="grid">
        <div class="grid-item"><div class="label">Entry</div><div class="value num">${fmtPrice(pos.entryPrice)}</div></div>
        <div class="grid-item"><div class="label">Stop</div><div class="value num down-text">${fmtPrice(pos.currentStop)}</div></div>
        <div class="grid-item"><div class="label">Tgt 1R</div><div class="value num up-text">${fmtPrice(pos.target1)}</div></div>
      </div>
    `;
  }

  function renderReasoning(data) {
    const el = document.getElementById("reasoningText");
    const { verdict, sub } = condenseReasoning(data.reasoning);
    el.innerHTML = `<div class="verdict-line">${verdict}</div>${sub ? `<div class="verdict-sub">${sub}</div>` : ""}`;
  }

  function renderScores(data) {
    const el = document.getElementById("scoresRow");
    const scores = data.latestScores;
    if (!scores || !scores.length) {
      el.innerHTML = `<span style="color:var(--muted);font-size:11px">--</span>`;
      return;
    }
    el.innerHTML = scores
      .slice(0, 5)
      .map(s => `<div class="score-chip"><span class="sym">${s.symbol}</span><span class="val num">${s.score}</span></div>`)
      .join("");
  }

  function renderFooter(data) {
    const el = document.getElementById("footerNote");
    el.textContent = `${data.strategyName || ""}  ·  ₹${usdInr.toFixed(2)}/$`;
  }

  function tickUpdatedAgo() {
    const el = document.getElementById("updatedAgo");
    if (lastSnapshot && lastSnapshot.updatedAt) el.textContent = timeAgo(lastSnapshot.updatedAt);
  }

  async function fetchFxRate() {
    try {
      const res = await fetch(FX_URL, { cache: "no-store" });
      const json = await res.json();
      if (json && json.rates && json.rates.INR) usdInr = json.rates.INR;
    } catch (e) {
      console.log("FX fetch failed, using fallback rate", e);
    }
  }

  async function fetchSnapshot() {
    try {
      const res = await fetch(SNAPSHOT_URL, {
        cache: "no-store",
        headers: { "Accept": "application/vnd.github.raw+json" },
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      lastSnapshot = data;
      renderPosition(data);
      renderReasoning(data);
      renderScores(data);
      renderFooter(data);
    } catch (e) {
      document.getElementById("positionCard").innerHTML = `<div class="err">Fetch failed: ${e.message}</div>`;
    }
  }

  fetchFxRate();
  fetchSnapshot();
  setInterval(fetchSnapshot, 75000);       // stays under the API's 60/hr unauthenticated limit
  setInterval(fetchFxRate, 5 * 60 * 1000);
  setInterval(tickUpdatedAgo, 1000);
</script>

</body>
</html>
